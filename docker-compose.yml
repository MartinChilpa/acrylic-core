version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: acrylic-db
    environment:
      POSTGRES_DB: acrylic
      POSTGRES_USER: acrylic
      POSTGRES_PASSWORD: acrylic-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acrylic"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: acrylic-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acrylic-backend
    environment:
      DATABASE_URL: postgresql://acrylic:acrylic-dev-password@db:5432/acrylic
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: /app/entrypoint.sh

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acrylic-worker
    environment:
      DATABASE_URL: postgresql://acrylic:acrylic-dev-password@db:5432/acrylic
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A acrylic worker --loglevel=info --concurrency=1

  frontend:
    build:
      context: ../acrylic-platform
      dockerfile: Dockerfile
    container_name: acrylic-frontend
    environment:
      PLATFORM_API_ORIGIN: http://backend:8000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
